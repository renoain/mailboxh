name: mailboxh
description: "Mailboxh, aplikasi mobile katalog film sosial."
publish_to: 'none'

# Versi mengikuti PROTOCOL.md Bagian K. Rilis MVP adalah v0.1.0.
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Daftar dependency dan evaluasinya ada di docs/ARCHITECTURE.md bagian 8.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_lucide: ^1.56.0
  cached_network_image_ce: ^4.13.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  logger: ^2.8.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true