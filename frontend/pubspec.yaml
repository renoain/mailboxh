name: mailboxh
description: "Aplikasi katalog film sosial Mailboxh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # HTTP dan penyimpanan aman
  dio: ^5.5.0
  flutter_secure_storage: ^9.0.0

  # Gambar dan ikon
  cached_network_image_ce: ^4.13.1
  flutter_lucide: ^1.0.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
